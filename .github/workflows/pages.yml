name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Metlink republishes its timetable feed often and each feed only covers a few weeks,
  # so rebuild daily at 04:00 NZST (16:00 UTC) to keep the date picker current.
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer run replaces one that is still queued, but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
      VITE_LINZ_BASEMAPS_KEY: ${{ secrets.VITE_LINZ_BASEMAPS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in LINZ_API_KEY VITE_LINZ_BASEMAPS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: make check

      - name: Download the Metlink GTFS feed and build the data
        run: make refresh

      - name: Download the LINZ coastline
        run: make coastline

      - name: Build the site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
