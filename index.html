<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wellington trains</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div id="title">Wellington trains</div>
      <div id="clock">--:--</div>
      <div id="date-line"><input id="date" type="date" /></div>
      <div id="count"></div>
    </div>
    <div id="controls">
      <button id="play" aria-label="Play or pause">Pause</button>
      <input id="scrub" type="range" min="0" max="86400" step="10" value="0" />
      <select id="speed" aria-label="Speed"></select>
      <label><input id="basemap" type="checkbox" checked /> Basemap</label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
