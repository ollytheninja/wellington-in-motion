<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wellington in motion</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div id="title">Wellington in motion</div>
      <div id="clock">--:--</div>
      <div id="date-line"><input id="date" type="date" /></div>
      <div id="meters">
        <div class="meter" data-mode="bus"><div class="bar"><i></i></div><span class="n"></span><span class="what">buses</span></div>
        <div class="meter" data-mode="rail"><div class="bar"><i></i></div><span class="n"></span><span class="what">trains</span></div>
        <div class="meter" data-mode="ferry"><div class="bar"><i></i></div><span class="n"></span><span class="what">ferries</span></div>
      </div>
    </div>
    <aside id="credits">
      <button type="button" id="credits-toggle" aria-controls="credits-body"></button>
      <div id="credits-body">
        <h2>Settings</h2>
        <div id="settings">
          <button id="now" type="button" title="Jump to the date and time it is in Wellington now, at normal speed">Real time, right now</button>
          <label class="row">Speed <select id="speed" aria-label="Speed"></select></label>
          <label class="check"><input id="buses" type="checkbox" checked disabled /> Show buses</label>
          <label class="check"><input id="loop" type="checkbox" /> Loop the day</label>
        </div>
        <h2>Credits</h2>
        <div id="credit-list"></div>
      </div>
    </aside>
    <div id="timeline">
      <button id="play" type="button" aria-label="Play or pause"></button>
      <input id="scrub" type="range" min="0" max="86400" step="10" value="0" aria-label="Time of day" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
